# Builds the sdist and wheel, checks them, and uploads them to PyPI when a GitHub release is published.
# Run it by hand (Actions -> "Publish to PyPI" -> "Run workflow") to dry-run against TestPyPI or to only build.
# Uploads use PyPI trusted publishing (OpenID Connect), so no API token is stored in the repository.
# One-time PyPI and GitHub setup, and the release procedure, are in RELEASING.md.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload_to:
        description: "Where to upload the built distributions"
        type: choice
        options:
          - testpypi
          - nowhere
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "${package_version}" != "${tag_version}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match the pyproject.toml version ${package_version}"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Run the tests against the installed wheel
        # Tests the wheel rather than the source tree so a packaging mistake (a missing module or file) fails here.
        run: |
          python -m pip install dist/*.whl pytest packaging
          python -m pytest tests -q

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pandoravisibility/
    permissions:
      id-token: write  # Lets the job request the OpenID Connect token that PyPI trusted publishing checks.
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        # To use an API token instead of trusted publishing, add the secret to the pypi environment and:
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.upload_to == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pandoravisibility/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
